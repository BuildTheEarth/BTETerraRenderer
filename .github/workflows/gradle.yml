# This workflow will build a Java project with Gradle
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-gradle

name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  generate-build-matrix:
    runs-on: ubuntu-latest
    name: Generate build matrix

    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get versions
        id: generate-matrix
        run: |
          MATRIX=$(jq -c '{include: (.versions | map({target: ., name: (split(":")[0])}))}' ./versions.json)
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  build:
    name: Build ${{ matrix.name }}
    needs: generate-build-matrix
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-build-matrix.outputs.matrix) }}

    steps:
      - name: Check out repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: 'basic'

      - name: Build with Gradle
        run: |
          ./gradlew "Refresh active project" --configuration-cache
          ./gradlew copyBuildResultToRoot --configuration-cache
        env:
          CI_SINGLE_BUILD: ${{ matrix.target }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: build/libs/*.jar
